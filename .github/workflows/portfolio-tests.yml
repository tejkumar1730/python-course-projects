name: Resume portfolio tests

on:
  push:
    paths:
      - '11_job_portal/**'
      - '12_inventory_management/**'
      - '13_product_api/**'
      - 'portfolio-requirements.txt'
      - '.github/workflows/portfolio-tests.yml'
  pull_request:
    paths:
      - '11_job_portal/**'
      - '12_inventory_management/**'
      - '13_product_api/**'
      - 'portfolio-requirements.txt'
      - '.github/workflows/portfolio-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mysql-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4.10
        env:
          MYSQL_ROOT_PASSWORD: temporary-ci-password
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      DATABASE_ENGINE: mysql
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: temporary-ci-password
      DJANGO_SECRET_KEY: temporary-ci-key-used-only-in-disposable-tests
      RUN_MYSQL_TESTS: '1'
      TEST_MYSQL_DATABASE: inventory_management_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: portfolio-requirements.txt
      - name: Install database build dependencies
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config
      - name: Install Python dependencies
        run: python -m pip install -r portfolio-requirements.txt
      - name: Create disposable integration database
        run: |
          python - <<'PY'
          import os
          import mysql.connector
          connection = mysql.connector.connect(
              host=os.environ['MYSQL_HOST'], port=int(os.environ['MYSQL_PORT']),
              user=os.environ['MYSQL_USER'], password=os.environ['MYSQL_PASSWORD'])
          cursor = connection.cursor()
          for database in ['job_portal', 'product_api', 'inventory_management_test']:
              cursor.execute(f'CREATE DATABASE `{database}` CHARACTER SET utf8mb4')
          cursor.close()
          connection.close()
          PY
      - name: Test Job Portal on MySQL
        env:
          MYSQL_DATABASE: job_portal
        run: |
          python 11_job_portal/manage.py check
          python 11_job_portal/manage.py makemigrations --check --dry-run
          python 11_job_portal/manage.py test jobs --noinput
      - name: Test Inventory and real transactions
        working-directory: 12_inventory_management
        run: python -m unittest discover -s tests -v
      - name: Test Product API on MySQL
        env:
          MYSQL_DATABASE: product_api
        run: |
          python 13_product_api/manage.py check
          python 13_product_api/manage.py makemigrations --check --dry-run
          python 13_product_api/manage.py test products --noinput
